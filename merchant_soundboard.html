<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Merchant Soundboard — Slay the Spire 2</title>
<style>
  /* ==========  StS2 Merchant Theme  ========== */
  :root {
    --navy-deep:  #0a0e27;
    --navy-mid:   #141b3d;
    --indigo:     #1e2a5c;
    --indigo-light: #2d3b73;
    --cream:      #e8dcc0;
    --cream-dim:  #b8a884;
    --gold:       #c9a44c;
    --gold-bright:#e6c860;
    --magenta:    #c0437a;
    --magenta-glow: rgba(192, 67, 122, 0.5);
    --cyan-skin:  #8ec7c7;
    --red-sigil:  #b22222;
    --red-sigil-bright: #e04040;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center 30%, var(--indigo) 0%, var(--navy-mid) 45%, var(--navy-deep) 100%);
    font-family: 'Georgia', 'Palatino', 'Times New Roman', serif;
    color: var(--cream);
    position: relative;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Magenta rim-light overlay (simulates the rim lighting on the merchant) */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse 70% 50% at 50% 100%, rgba(192, 67, 122, 0.18), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* Subtle vignette */
  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.5) 100%);
    pointer-events: none;
    z-index: 0;
  }

  /* ==========  Hooded Figure SVG Container  ========== */
  .merchant-figure {
    position: relative;
    width: 180px;
    height: 200px;
    margin-bottom: 1rem;
    z-index: 1;
    filter: drop-shadow(0 0 20px var(--magenta-glow));
    transition: filter 0.3s ease;
  }

  .merchant-figure.playing {
    filter: drop-shadow(0 0 30px var(--magenta-glow)) drop-shadow(0 0 10px rgba(142, 199, 199, 0.4));
    animation: figureFloat 2s ease-in-out infinite;
  }

  @keyframes figureFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  /* ==========  Main Container  ========== */
  .container {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 500px;
    padding: 1.5rem;
    text-align: center;
  }

  /* ==========  Title  ========== */
  .title {
    font-size: 1.1rem;
    color: var(--gold);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 0.3rem;
    text-shadow: 0 0 8px rgba(201, 164, 76, 0.3);
  }

  .subtitle {
    font-size: 0.75rem;
    color: var(--cream-dim);
    letter-spacing: 0.1em;
    margin-bottom: 1.8rem;
    font-style: italic;
  }

  /* ==========  Big Button  ========== */
  .merchant-btn {
    position: relative;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    border: 3px solid var(--gold);
    background: radial-gradient(circle at 50% 40%, var(--indigo-light) 0%, var(--indigo) 50%, var(--navy-deep) 100%);
    color: var(--cream);
    font-family: inherit;
    font-size: 1.15rem;
    font-weight: bold;
    letter-spacing: 0.05em;
    line-height: 1.4;
    cursor: pointer;
    z-index: 2;
    transition: all 0.2s ease;
    box-shadow:
      0 0 30px rgba(201, 164, 76, 0.2),
      inset 0 0 40px rgba(10, 14, 39, 0.6);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }

  .merchant-btn::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 100%; height: 100%;
    border-radius: 50%;
    border: 1px solid rgba(201, 164, 76, 0.15);
    transform: translate(-50%, -50%) scale(1.15);
    pointer-events: none;
  }

  .merchant-btn:active:not(:disabled) {
    transform: scale(0.96);
    box-shadow:
      0 0 40px rgba(201, 164, 76, 0.35),
      inset 0 0 50px rgba(10, 14, 39, 0.7);
  }

  .merchant-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    border-color: var(--cream-dim);
  }

  .merchant-btn.playing {
    border-color: var(--magenta);
    box-shadow:
      0 0 40px var(--magenta-glow),
      inset 0 0 50px rgba(192, 67, 122, 0.15);
    animation: btnPulse 1.2s ease-in-out infinite;
  }

  @keyframes btnPulse {
    0%, 100% {
      box-shadow: 0 0 40px var(--magenta-glow), inset 0 0 50px rgba(192, 67, 122, 0.1);
    }
    50% {
      box-shadow: 0 0 60px var(--magenta-glow), inset 0 0 50px rgba(192, 67, 122, 0.25);
    }
  }

  /* ==========  Equalizer Bars  ========== */
  .equalizer {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 4px;
    height: 50px;
    margin-top: 1.5rem;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .equalizer.active {
    opacity: 1;
  }

  .eq-bar {
    width: 6px;
    background: linear-gradient(to top, var(--magenta), var(--cyan-skin));
    border-radius: 3px;
    height: 6px;
    transition: height 0.1s ease;
  }

  .equalizer.active .eq-bar {
    animation: eqBounce 0.4s ease-in-out infinite alternate;
  }

  .equalizer.active .eq-bar:nth-child(1) { animation-delay: 0.0s; }
  .equalizer.active .eq-bar:nth-child(2) { animation-delay: 0.1s; }
  .equalizer.active .eq-bar:nth-child(3) { animation-delay: 0.2s; }
  .equalizer.active .eq-bar:nth-child(4) { animation-delay: 0.15s; }
  .equalizer.active .eq-bar:nth-child(5) { animation-delay: 0.05s; }
  .equalizer.active .eq-bar:nth-child(6) { animation-delay: 0.25s; }
  .equalizer.active .eq-bar:nth-child(7) { animation-delay: 0.1s; }
  .equalizer.active .eq-bar:nth-child(8) { animation-delay: 0.3s; }
  .equalizer.active .eq-bar:nth-child(9) { animation-delay: 0.18s; }

  @keyframes eqBounce {
    0%   { height: 6px; }
    100% { height: 42px; }
  }

  /* ==========  Now Playing Text  ========== */
  .now-playing {
    margin-top: 1.2rem;
    font-size: 0.9rem;
    color: var(--cream-dim);
    letter-spacing: 0.08em;
    min-height: 1.4em;
    transition: opacity 0.3s ease;
  }

  .now-playing .line-num {
    color: var(--gold-bright);
    font-weight: bold;
  }

  /* ==========  Detection Status  ========== */
  .status {
    margin-top: 0.8rem;
    font-size: 0.7rem;
    color: var(--cream-dim);
    opacity: 0.6;
    letter-spacing: 0.05em;
  }

  /* ==========  Loading Spinner  ========== */
  .spinner {
    width: 20px;
    height: 20px;
    border: 2px solid var(--cream-dim);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: inline-block;
    vertical-align: middle;
    margin-right: 6px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ==========  Responsive  ========== */
  @media (max-width: 400px) {
    .merchant-btn {
      width: 180px;
      height: 180px;
      font-size: 1rem;
    }
    .merchant-figure {
      width: 140px;
      height: 155px;
    }
    .title { font-size: 0.95rem; }
  }

  @media (max-height: 600px) {
    .merchant-figure {
      width: 120px;
      height: 133px;
      margin-bottom: 0.5rem;
    }
    .merchant-btn {
      width: 160px;
      height: 160px;
      font-size: 0.95rem;
    }
    .subtitle { margin-bottom: 1rem; }
    .equalizer { margin-top: 0.8rem; height: 40px; }
    .now-playing { margin-top: 0.6rem; }
  }
</style>
</head>
<body>

<div class="container">

  <!-- Hooded Merchant Figure (SVG) -->
  <div class="merchant-figure" id="merchantFigure">
    <svg viewBox="0 0 180 200" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
      <!-- Hood (navy/indigo) -->
      <path d="M90 10 C40 10, 25 55, 28 110 C30 140, 35 165, 45 180 L135 180 C145 165, 150 140, 152 110 C155 55, 140 10, 90 10 Z"
            fill="#1e2a5c" stroke="#2d3b73" stroke-width="1.5"/>
      <!-- Inner hood shadow -->
      <path d="M90 20 C52 20, 40 58, 43 105 C45 130, 50 152, 58 168 L122 168 C130 152, 135 130, 137 105 C140 58, 128 20, 90 20 Z"
            fill="#141b3d"/>

      <!-- Face plate area (cream colored) -->
      <ellipse cx="90" cy="85" rx="32" ry="40" fill="#e8dcc0" opacity="0.95"/>
      <!-- Face plate inner shadow for depth -->
      <ellipse cx="90" cy="87" rx="28" ry="36" fill="#d4c4a0" opacity="0.5"/>

      <!-- Red swirl sigil on face plate -->
      <g transform="translate(90, 85)">
        <path d="M0 -18 C8 -18, 14 -10, 14 0 C14 8, 8 16, 0 16 C-6 16, -10 12, -10 6 C-10 2, -7 -1, -3 -1 C0 -1, 2 1, 2 4"
              fill="none" stroke="#b22222" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
        <circle cx="0" cy="0" r="2.5" fill="#e04040"/>
      </g>

      <!-- Pale cyan skin — visible portions (around face plate edges) -->
      <path d="M62 78 C60 72, 62 65, 66 60 L66 95 C63 92, 62 85, 62 78 Z"
            fill="#8ec7c7" opacity="0.6"/>
      <path d="M118 78 C120 72, 118 65, 114 60 L114 95 C117 92, 118 85, 118 78 Z"
            fill="#8ec7c7" opacity="0.6"/>

      <!-- Eye glow (faint) -->
      <circle cx="78" cy="78" r="3" fill="#8ec7c7" opacity="0.5"/>
      <circle cx="102" cy="78" r="3" fill="#8ec7c7" opacity="0.5"/>

      <!-- Robe shoulders (indigo, draped) -->
      <path d="M28 110 C25 120, 20 135, 18 150 L22 180 L45 180 C40 160, 35 135, 38 115 Z"
            fill="#141b3d" stroke="#1e2a5c" stroke-width="1"/>
      <path d="M152 110 C155 120, 160 135, 162 150 L158 180 L135 180 C140 160, 145 135, 142 115 Z"
            fill="#141b3d" stroke="#1e2a5c" stroke-width="1"/>

      <!-- Magenta rim light highlight (left edge) -->
      <path d="M28 110 C25 120, 20 135, 18 150 L22 180" fill="none"
            stroke="#c0437a" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
      <!-- Magenta rim light highlight (hood top left) -->
      <path d="M90 10 C50 12, 32 50, 28 100" fill="none"
            stroke="#c0437a" stroke-width="1.5" opacity="0.35" stroke-linecap="round"/>

      <!-- Claw-like hand hint at bottom -->
      <g opacity="0.4">
        <path d="M70 175 L68 182 M75 176 L74 184 M80 176 L80 185" stroke="#8ec7c7" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <path d="M100 176 L100 185 M105 176 L106 184 M110 175 L112 182" stroke="#8ec7c7" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      </g>
    </svg>
  </div>

  <div class="title">The Merchant</div>
  <div class="subtitle">"Greetings, traveler..."</div>

  <!-- Main Button -->
  <button class="merchant-btn" id="merchantBtn" disabled>
    Talk to the<br>Merchant
  </button>

  <!-- Equalizer Visualizer -->
  <div class="equalizer" id="equalizer">
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
  </div>

  <!-- Now Playing -->
  <div class="now-playing" id="nowPlaying"></div>

  <!-- Status -->
  <div class="status" id="status">
    <span class="spinner" id="spinner"></span>Detecting voice lines...
  </div>

</div>

<script>
(function() {
  'use strict';

  // ===================================================================
  //  Configuration
  // ===================================================================
  var MAX_SOUNDS   = 12;                       // Max number of merchant voice clips to probe
  var SOUND_PREFIX = 'sounds/merchant_';       // Path prefix for audio files
  var SOUND_SUFFIX = '.mp3';                   // File extension
  var CLICK_COOLDOWN_MS = 1000;                // Button cooldown after click (ms)

  // ===================================================================
  //  State
  // ===================================================================
  var availableIndices = [];   // Array of detected sound file indices (1-based)
  var currentAudio     = null;
  var buttonDisabled   = false;
  var lastPlayedIndex  = -1;

  // ===================================================================
  //  DOM References
  // ===================================================================
  var btn           = document.getElementById('merchantBtn');
  var equalizer     = document.getElementById('equalizer');
  var nowPlaying    = document.getElementById('nowPlaying');
  var statusEl      = document.getElementById('status');
  var spinnerEl     = document.getElementById('spinner');
  var figureEl      = document.getElementById('merchantFigure');

  // ===================================================================
  //  Sound File Detection
  //  Probes each file by attempting to load it. Files that successfully
  //  load are added to the available list. Files that error (404 / not
  //  found) are skipped.
  // ===================================================================
  function pad2(n) {
    return n < 10 ? '0' + n : '' + n;
  }

  function soundPath(index) {
    return SOUND_PREFIX + pad2(index) + SOUND_SUFFIX;
  }

  function detectSounds() {
    var probes = [];
    for (var i = 1; i <= MAX_SOUNDS; i++) {
      probes.push(probeSound(i));
    }

    Promise.all(probes).then(function(results) {
      availableIndices = results.filter(function(r) { return r.found; })
                                 .map(function(r) { return r.index; })
                                 .sort(function(a, b) { return a - b; });

      onDetectionComplete();
    });
  }

  function probeSound(index) {
    return new Promise(function(resolve) {
      var audio = new Audio();
      var settled = false;

      function done(found) {
        if (settled) return;
        settled = true;
        audio.removeAttribute('src');
        audio.load();
        resolve({ index: index, found: found });
      }

      // 'canplaythrough' or 'loadedmetadata' means the file exists and is loadable
      audio.addEventListener('loadedmetadata', function() { done(true); });
      audio.addEventListener('canplaythrough', function() { done(true); });
      audio.addEventListener('error', function() { done(false); });

      // Timeout fallback: if nothing fires in 3 seconds, assume not found
      setTimeout(function() { done(false); }, 3000);

      audio.preload = 'metadata';
      audio.src = soundPath(index);
    });
  }

  function onDetectionComplete() {
    var count = availableIndices.length;
    spinnerEl.style.display = 'none';

    if (count === 0) {
      statusEl.innerHTML = 'No voice lines found. Place MP3 files in a <code>sounds/</code> folder next to this file.';
      statusEl.style.opacity = '0.8';
      // Keep button disabled
      return;
    }

    statusEl.innerHTML = count + ' voice line' + (count > 1 ? 's' : '') + ' detected';
    statusEl.style.opacity = '0.5';
    btn.disabled = false;
  }

  // ===================================================================
  //  Play Random Sound
  // ===================================================================
  function playRandom() {
    if (buttonDisabled || availableIndices.length === 0) return;

    // Disable button for cooldown
    setButtonDisabled(true);

    // Pick a random index, avoid repeating the same one if possible
    var candidates = availableIndices;
    if (availableIndices.length > 1) {
      candidates = availableIndices.filter(function(idx) {
        return idx !== lastPlayedIndex;
      });
    }

    var pick = candidates[Math.floor(Math.random() * candidates.length)];
    lastPlayedIndex = pick;

    // Stop any currently playing audio
    if (currentAudio) {
      currentAudio.pause();
      currentAudio = null;
    }

    var audio = new Audio(soundPath(pick));
    currentAudio = audio;

    // Update UI
    var total = availableIndices.length;
    nowPlaying.innerHTML = 'Line <span class="line-num">' + pad2(pick) + '</span> of ' + total;
    btn.classList.add('playing');
    equalizer.classList.add('active');
    figureEl.classList.add('playing');

    audio.addEventListener('ended', function() {
      stopPlaybackVisuals();
    });

    audio.addEventListener('error', function() {
      stopPlaybackVisuals();
      nowPlaying.innerHTML = '<span style="color: var(--red-sigil-bright);">Failed to play line ' + pad2(pick) + '</span>';
    });

    audio.play().catch(function() {
      stopPlaybackVisuals();
      nowPlaying.innerHTML = '<span style="color: var(--red-sigil-bright);">Playback blocked</span>';
    });

    // Re-enable button after cooldown
    setTimeout(function() {
      setButtonDisabled(false);
    }, CLICK_COOLDOWN_MS);
  }

  function stopPlaybackVisuals() {
    btn.classList.remove('playing');
    equalizer.classList.remove('active');
    figureEl.classList.remove('playing');
  }

  function setButtonDisabled(disabled) {
    buttonDisabled = disabled;
    btn.disabled = disabled;
  }

  // ===================================================================
  //  Event Listeners
  // ===================================================================
  btn.addEventListener('click', function(e) {
    e.preventDefault();
    playRandom();
  });

  // Prevent double-tap zoom on mobile
  btn.addEventListener('touchend', function(e) {
    e.preventDefault();
    if (!buttonDisabled) {
      playRandom();
    }
  }, { passive: false });

  // Spacebar / Enter to trigger
  document.addEventListener('keydown', function(e) {
    if ((e.code === 'Space' || e.code === 'Enter') && !buttonDisabled) {
      e.preventDefault();
      playRandom();
    }
  });

  // ===================================================================
  //  Init
  // ===================================================================
  detectSounds();

})();
</script>

</body>
</html>
